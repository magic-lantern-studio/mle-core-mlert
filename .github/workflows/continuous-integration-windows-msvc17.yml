name: Continuous Integration Build (Windows, Visual Studio 2022)

on:
  workflow_dispatch:  # Allow manual triggers
  push:
    branches: [ "master" ]

env:
  MLE_ROOT: C:\opt\MagicLantern
  # The Visual Studio post-build steps copy headers from
  # $(MLE_HOME)\Core\mlert\... (see the junction created below).
  MLE_HOME: C:\MagicLanternStudio

jobs:
  windows-build:
    name: Windows Build
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Add msbuild to Path
        uses: microsoft/setup-msbuild@v2
        with:
            msbuild-architecture: x64
      # Download the latest mle-core-dwp artifact into %MLE_ROOT%. It contains
      # the mle-core-dwp, mle-core-math and mle-core-util libraries and headers.
      - name: Download mle-core-dwp artifacts
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir %MLE_ROOT%
          gh run download --repo magic-lantern-studio/mle-core-dwp --name mle-core-dwp-windows-Release --dir %MLE_ROOT%
          dir /s /b %MLE_ROOT%
      # Recreate the %MLE_HOME%\Core\mlert layout that the projects expect.
      - name: Create MLE_HOME layout
        shell: cmd
        run: |
          mkdir %MLE_HOME%\Core
          mklink /J %MLE_HOME%\Core\mlert %GITHUB_WORKSPACE%\mlert
      - name: Build with msbuild
        shell: cmd
        run: |
          cd mlert\win32\build\msvc17
          msbuild mlert.sln /p:Configuration=Release /p:Platform=x64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mle-core-mlert-windows-Release
          path: ${{ env.MLE_ROOT }}
